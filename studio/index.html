<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>The studio | Nick Mehra</title>
<link rel="canonical" href="https://nickmehra.ca/studio/">
<meta name="description" content="Walk through Nick Mehra's studio: selected work, portraits, experience, story and journal.">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{--fg:#EFEBE3;--muted:#A9ADB3;--red:#D11F26;--panel:rgba(10,11,13,.88);--display:"Bodoni Moda",Georgia,serif;--body:"EB Garamond",Garamond,Georgia,serif}
:root[data-theme="light"]{--fg:#08090A;--muted:#25292E;--red:#9A1219;--panel:rgba(245,245,242,.94)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:var(--body)}
#view{position:fixed;inset:0;overflow:hidden;background:#000}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transition:transform 1s cubic-bezier(.6,0,.3,1),opacity .9s ease,filter .9s ease}
.stage .drift{position:absolute;inset:0;animation:drift 26s ease-in-out infinite alternate}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;transition:opacity 1.2s ease,filter 1.2s ease}
.stage img.night{opacity:0}
:root[data-theme="dark"] .stage img.night{opacity:1}
:root[data-theme="dark"] .stage.dim img.day{filter:brightness(.52) saturate(.85) sepia(.1)}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.035) translate(-.6%,-.4%)}}
.stage.out{opacity:0;filter:blur(6px)}
.hs{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;color:#F5F5F2;font-family:var(--display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;z-index:2;min-width:44px;min-height:44px;text-decoration:none}
.hs .dot{width:22px;height:22px;border-radius:50%;border:2px solid #F5F5F2;background:rgba(209,31,38,.55);animation:pulse 2.4s ease-out infinite}
.hs.info .dot{background:rgba(245,245,242,.22);width:16px;height:16px}
.hs .lbl{background:rgba(8,9,10,.74);padding:6px 10px;white-space:nowrap;border-left:2px solid #D11F26;transition:opacity .3s}
.hs.info .lbl{opacity:0}
.hs:hover .lbl,.hs:focus-visible .lbl{opacity:1}
.hs:focus-visible{outline:2px solid #F5F5F2;outline-offset:4px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,245,242,.55)}80%,100%{box-shadow:0 0 0 18px rgba(245,245,242,0)}}
@media (prefers-reduced-motion:reduce){.stage .drift,.hs .dot{animation:none}.stage{transition:opacity .4s}}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,0));z-index:5}
.top a,.top button{font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:#EFEBE3;background:none;border:0;cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
.top .brand{font-size:13px}.top .brand span{color:#D11F26}
.top .r{display:flex;gap:16px}.top .r a,.top .r button{font-size:11px}
.room{position:fixed;left:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:5;color:#EFEBE3;text-shadow:0 1px 8px rgba(0,0,0,.7);pointer-events:none}
.room small{display:block;font-family:var(--display);font-size:10px;letter-spacing:.3em;color:#D11F26;text-transform:uppercase}
.room b{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.08em}
nav.ui{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.72));z-index:5}
nav.ui button,nav.ui a{font-family:var(--display);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;padding:0 11px;min-height:40px;display:inline-flex;align-items:center;color:#EFEBE3;background:rgba(10,11,13,.5);border:1px solid rgba(209,31,38,.85);text-decoration:none;cursor:pointer}
nav.ui .on{background:#D11F26}
#cap{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translate(-50%,8px);max-width:min(560px,90vw);margin:0;padding:12px 18px;background:var(--panel);color:var(--fg);border-left:3px solid var(--red);font-size:17px;line-height:1.4;opacity:0;pointer-events:none;transition:.35s;z-index:6}
#cap.on{opacity:1;transform:translate(-50%,0)}
#garage{position:fixed;inset:0;z-index:9;pointer-events:none;display:none;flex-direction:column}
#garage.show{display:flex}
#garage .slat{flex:1;background:linear-gradient(#2c2e33,#1a1b1f 45%,#26282d);border-bottom:2px solid #0d0e10;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
#garage .edge{height:4px;background:#D11F26;box-shadow:0 0 30px 8px rgba(209,31,38,.45)}
#garage.up{transform:translateY(-103%);transition:transform 2.2s cubic-bezier(.55,0,.25,1)}
#car{position:fixed;inset:0;z-index:10;background:rgba(5,6,7,.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#car.on{display:flex}
#car h2{margin:0;font-family:var(--display);font-weight:600;letter-spacing:.12em;color:#EFEBE3;font-size:20px;text-align:center}
#car p{margin:0;color:#A9ADB3;text-align:center;max-width:620px}
#car .frame{position:relative;width:min(1100px,94vw);aspect-ratio:16/9;background:#000;overflow:hidden;cursor:grab;touch-action:none}
#car video,#car .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#car .hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-family:var(--display);font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#EFEBE3;background:rgba(0,0,0,.55);padding:6px 10px;transition:opacity .4s}
#car .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#car button,#car a{font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;min-height:44px;padding:0 16px;color:#EFEBE3;background:transparent;border:1px solid #D11F26;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
#car button:hover,#car button:focus-visible,#car a:hover{background:#D11F26;outline:none}
.room{bottom:calc(96px + env(safe-area-inset-bottom))}
@media (max-width:700px){.room{top:64px;bottom:auto}.room b{font-size:18px}.top .brand{font-size:11px}.top .r{gap:10px}.top .r a,.top .r button{font-size:9.5px}nav.ui button,nav.ui a{font-size:9.5px;padding:0 8px;min-height:38px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* classic header, identical to nickmehra.ca */
.top{display:none!important}
:root{--h-bg:#08080a;--h-ink:#f4f2ee;--h-mute:#9d9fa7;--h-line:rgba(244,242,238,.14);--h-red:#b3202b;--lens:linear-gradient(100deg,#c2202c 0%,#e2622b 48%,#e9a42c 100%);--nbody:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
:root[data-theme="light"]{--h-bg:#f3f0ea;--h-ink:#111113;--h-mute:#3c3d44;--h-line:#cfc9bd}
header.nav{position:fixed;top:0;left:0;right:0;z-index:20;background:color-mix(in srgb,var(--h-bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--h-line);padding-top:env(safe-area-inset-top,0px);font-family:var(--nbody)}
header.nav .bar{position:relative;display:flex;flex-direction:row;flex-wrap:nowrap;justify-content:space-between;align-items:center;gap:28px;padding:12px 28px;min-height:64px;max-width:1160px;margin:0 auto;box-sizing:border-box}
header.nav .mark{font-family:"Bodoni Moda","Didot","Bodoni MT",Georgia,serif;font-size:21px;font-style:italic;text-decoration:none;white-space:nowrap;line-height:1.2;color:var(--h-ink)}
header.nav .mark span{font-style:normal;background:var(--lens);-webkit-background-clip:text;background-clip:text;color:transparent}
header.nav .links{display:flex;flex-wrap:nowrap;justify-content:flex-end;gap:0 28px;margin-left:auto;flex:1 1 auto;min-width:0}
header.nav a.l{position:relative;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--h-mute);padding:8px 0;white-space:nowrap;transition:color .25s ease}
header.nav a.l:hover{color:var(--h-ink)}
header.nav a.l::after{content:'';position:absolute;left:0;right:0;bottom:1px;height:1px;background:var(--h-red);transform:scaleX(0);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
header.nav a.l:hover::after,header.nav a.l:focus-visible::after{transform:scaleX(1)}
header.nav a.l:focus-visible{outline:1px solid var(--h-line);outline-offset:6px}
header.nav button{position:static;margin:0 0 0 22px;padding:7px 13px;font:600 10px var(--nbody);letter-spacing:.14em;text-transform:uppercase;background:var(--h-ink);color:var(--h-bg);border:0;border-radius:999px;cursor:pointer;flex:none}
@media (max-width:980px){header.nav .bar{flex-wrap:wrap;gap:6px 16px;padding:10px 18px}header.nav .links{order:3;width:100%;flex-basis:100%;margin:0;justify-content:flex-start;gap:0 22px;overflow-x:auto;scrollbar-width:none}header.nav button{margin-left:auto}}
@media (prefers-reduced-motion:reduce){header.nav a.l::after{transition:none}}
@media (max-width:700px){.room{top:calc(var(--hh,100px) + 10px)!important}}

/* classic nickmehra.ca buttons */
nav.ui button,nav.ui a,#car button,#car a{font:700 10.5px var(--nbody);letter-spacing:.2em;text-transform:uppercase;padding:0 18px;min-height:40px;border-radius:999px;border:1px solid #f4f2ee;background:rgba(8,8,10,.45);color:#f4f2ee;display:inline-flex;align-items:center;text-decoration:none;cursor:pointer;transition:transform .25s,background .25s,color .25s}
nav.ui button:hover,nav.ui a:hover,nav.ui button:focus-visible,nav.ui a:focus-visible,#car button:hover,#car a:hover,#car button:focus-visible,#car a:focus-visible{transform:translateY(-2px);background:#f4f2ee;color:#060607;outline:none}
nav.ui .on{background:var(--lens);border-color:transparent;color:#150a05}
@media (max-width:700px){nav.ui button,nav.ui a{font-size:9px;padding:0 11px;min-height:36px;letter-spacing:.14em}}
</style>
</head>
<body>
<div id="view" aria-label="Nick Mehra's studio. Use the buttons or the glowing points to open each part of the site."></div>
<header class="nav"><div class="bar">
  <a class="mark" href="/?classic=1">Nick <span>Mehra</span></a>
  <nav class="links" aria-label="Main"><a class="l" href="/?classic=1">Home</a><a class="l" href="/story/">Story</a><a class="l" href="/portraits/">Portraits</a><a class="l" href="/work/">Work</a><a class="l" href="/journal/">Journal</a><a class="l" href="/contact/">Contact</a></nav>
  <button id="theme" type="button" aria-label="Switch between dark and light">Light</button>
</div></header>
<div class="room" aria-live="polite"><small id="floor"></small><b id="rname"></b></div>
<nav class="ui" aria-label="Rooms and pages"></nav>
<p id="cap" role="status"></p>
<div id="garage" aria-hidden="true"></div>
<div id="car" role="dialog" aria-modal="true" aria-labelledby="carT"><h2 id="carT"></h2><div class="frame" id="frame"></div><p id="carS"></p><div class="row" id="carB"></div></div>
<nav class="sr" aria-label="All pages"><a href="/work/">Work</a> <a href="/portraits/">Portraits</a> <a href="/experience/">Experience</a> <a href="/story/">Story</a> <a href="/journal/">Journal</a> <a href="/now/">Now</a> <a href="/contact/">Contact</a></nav>
<script>
(function(){
var root=document.documentElement,saved=null;
try{saved=localStorage.getItem('nm-theme')}catch(e){}
root.dataset.theme=saved||'dark';
function scheme(){root.style.colorScheme=root.dataset.theme==='light'?'only light':'dark'}scheme();
var M='media/',sfx=Math.min(screen.width,screen.height)<700?'-m.webp':'.webp';
function img(n){return M+n+sfx}
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

var ROOMS={
 studio:{name:'The studio',floor:'Nick Mehra',day:'studio-day',night:'studio-night',spots:[
  {x:19,y:50,t:'Editing suite · Work',href:'/work/'},
  {x:40,y:52,t:'Photo set · Portraits',href:'/portraits/'},
  {x:74,y:38,t:'Gear wall · Experience',href:'/experience/'},
  {x:82,y:64,t:'Armchair · Story',href:'/story/'},
  {x:90,y:76,t:'Journal',href:'/journal/'},
  {x:56,y:80,t:'Now',href:'/now/'},
  {x:4,y:40,i:'North light through the factory windows: the best colour for grading and portraits.'},
  {x:93,y:36,i:'Late nights end here, with a lamp, a book and the next idea.'},
  {x:62,y:20,i:'Cameras, lenses, gimbals and the drone: every piece earns its place on the wall.'}]}
};
var CARS=[];

var view=document.getElementById('view'),stage=null,cur=null,busy=false,panX=0;
function size(el){
 var vw=innerWidth,vh=innerHeight,w=Math.max(vw,vh*16/9),h=w*9/16,max=Math.max(0,(w-vw)/2);
 panX=Math.max(-max,Math.min(max,panX));
 el.style.width=w+'px';el.style.height=h+'px';el.style.marginLeft=panX+'px';
}
function build(key){
 var r=ROOMS[key],s=document.createElement('div');s.className='stage'+(r.night?'':' dim');
 var d=document.createElement('div');d.className='drift';s.appendChild(d);
 var a=new Image();a.className='day';a.alt='';a.src=img(r.day);d.appendChild(a);
 if(r.night){var b=new Image();b.className='night';b.alt='';b.src=img(r.night);d.appendChild(b)}
 r.spots.forEach(function(p){
  var h=document.createElement(p.href?'a':'button');h.className='hs'+(p.i?' info':'');
  h.style.left=p.x+'%';h.style.top=p.y+'%';if(p.href)h.href=p.href;else h.type='button';
  h.innerHTML='<span class="dot"></span><span class="lbl">'+(p.t||'Detail')+'</span>';
  h.setAttribute('aria-label',p.t||p.i);
  h.addEventListener('click',function(e){
   if(p.i){e.preventDefault();caption(p.i);return}
   if(p.href){e.preventDefault();walkTo(p,function(){location.href=p.href});return}
   if(p.go==='garage'){walkTo(p,garage);return}
   if(p.go){walkTo(p,function(){show(p.go)});return}
   if(p.car!==undefined)openCar(p.car);
  });
  d.appendChild(h);
 });
 return s;
}
function show(key){
 var r=ROOMS[key],s=build(key);size(s);
 s.style.opacity='0';s.style.transform='translate(-50%,-50%) scale(1.06)';view.appendChild(s);
 if(stage)stage.remove();stage=s;cur=key;
 requestAnimationFrame(function(){requestAnimationFrame(function(){s.style.opacity='1';s.style.transform='translate(-50%,-50%) scale(1)';busy=false})});
 document.getElementById('rname').textContent=r.name;document.getElementById('floor').textContent=r.floor;
 try{history.replaceState(null,'','#'+key)}catch(e){}
 navUpdate();
}
function walkTo(p,done){
 if(busy)return;busy=true;
 if(reduce){done();return}
 stage.style.transformOrigin=p.x+'% '+p.y+'%';stage.style.transform='translate(-50%,-50%) scale(1.9)';stage.classList.add('out');
 setTimeout(done,950);
}
function garage(){
 var g=document.getElementById('garage');g.innerHTML='';
 for(var i=0;i<9;i++){var sl=document.createElement('div');sl.className='slat';g.appendChild(sl)}
 var e=document.createElement('div');e.className='edge';g.appendChild(e);
 g.className='show';show('show');
 setTimeout(function(){g.classList.add('up')},reduce?0:700);
 setTimeout(function(){g.className='';g.innerHTML=''},reduce?300:3100);
}
var capT;function caption(t){var c=document.getElementById('cap');c.textContent=t;c.classList.add('on');clearTimeout(capT);capT=setTimeout(function(){c.classList.remove('on')},4200)}

var NAV=[['Work','/work/'],['Portraits','/portraits/'],['Experience','/experience/'],['Story','/story/'],['Journal','/journal/'],['Now','/now/'],['Contact','/contact/'],['BlackSheep','https://blacksheepdigitalworks.ca/']];
var nav=document.querySelector('nav.ui');
NAV.forEach(function(n){
 var el;
 if(/[\/.]/.test(n[1])){el=document.createElement('a');el.href=n[1]}
 else{el=document.createElement('button');el.type='button';el.dataset.k=n[1];
  el.addEventListener('click',function(){
   if(busy)return;var k=n[1];
   if(k==='garage'){if(cur!=='show')garage();return}
   if(k===cur)return;busy=true;stage.classList.add('out');setTimeout(function(){show(k)},reduce?0:700);
  })}
 el.textContent=n[0];nav.appendChild(el);
});
function navUpdate(){[].forEach.call(nav.querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.k===cur||(b.dataset.k==='garage'&&cur==='show'))})}

var px=null,startPan=0;
view.addEventListener('pointerdown',function(e){if(e.target.closest('.hs'))return;px=e.clientX;startPan=panX});
addEventListener('pointermove',function(e){if(px===null||!stage)return;panX=startPan+(e.clientX-px);size(stage)});
addEventListener('pointerup',function(){px=null});
addEventListener('resize',function(){if(stage)size(stage)});

var carEl=document.getElementById('car'),frame=document.getElementById('frame'),btns=document.getElementById('carB'),raf=null;
function openCar(i){
 var c=CARS[i];document.getElementById('carT').textContent=c.name;document.getElementById('carS').textContent=c.s;
 frame.innerHTML='';btns.innerHTML='';
 if(c.spin){
  var v=document.createElement('video');v.src=c.spin;v.muted=true;v.playsInline=true;v.preload='auto';frame.appendChild(v);
  var d=document.createElement('video');d.src=c.doors;d.muted=true;d.playsInline=true;d.preload='auto';d.style.opacity='0';d.style.transition='opacity .4s';frame.appendChild(d);
  var hint=document.createElement('div');hint.className='hint';hint.textContent='Drag to walk around';frame.appendChild(hint);
  var dx=null,t0=0,open=false;
  frame.onpointerdown=function(e){if(open)return;dx=e.clientX;t0=v.currentTime;try{frame.setPointerCapture(e.pointerId)}catch(_){}};
  frame.onpointermove=function(e){if(dx===null||!v.duration)return;var t=t0-(e.clientX-dx)/frame.clientWidth*v.duration*1.2;v.currentTime=((t%v.duration)+v.duration)%v.duration;hint.style.opacity='0'};
  frame.onpointerup=frame.onpointercancel=function(){dx=null};
  var b=document.createElement('button');b.type='button';b.textContent='Open doors';
  b.onclick=function(){
   open=!open;b.textContent=open?'Close doors':'Open doors';cancelAnimationFrame(raf);
   if(open){d.style.opacity='1';d.currentTime=0;d.play()}
   else{d.pause();var last=performance.now();(function step(now){var dt=(now-last)/1000;last=now;d.currentTime=Math.max(0,d.currentTime-dt);if(d.currentTime>0.03)raf=requestAnimationFrame(step);else d.style.opacity='0'})(last)}
  };btns.appendChild(b);
 }else{
  var st=document.createElement('div');st.className='still';st.style.backgroundImage='url('+img(ROOMS.show.day)+')';
  st.style.backgroundSize='320% auto';st.style.backgroundPosition=c.crop;frame.appendChild(st);
 }
 var bk=document.createElement('a');bk.href='../booking.php';bk.textContent='Book a dealership shoot';btns.appendChild(bk);
 var x=document.createElement('button');x.type='button';x.textContent='Back to showroom';x.onclick=closeCar;btns.appendChild(x);
 carEl.classList.add('on');x.focus();
}
function closeCar(){cancelAnimationFrame(raf);carEl.classList.remove('on');frame.innerHTML=''}
addEventListener('keydown',function(e){if(e.key==='Escape'&&carEl.classList.contains('on'))closeCar()});
document.getElementById('theme').addEventListener('click',function(){
 root.dataset.theme=root.dataset.theme==='light'?'dark':'light';scheme();
 try{localStorage.setItem('nm-theme',root.dataset.theme)}catch(e){}
});
show('studio');
})();
</script>
<script src="/chat-kb.js?v=1" defer></script><script src="/chat.js?v=1" defer></script><script>
(function(){var r=document.documentElement,tb=document.getElementById('theme'),h=document.querySelector('header.nav');
function label(){tb.textContent=r.dataset.theme==='light'?'Dark':'Light'}label();tb.addEventListener('click',function(){setTimeout(label,0)});
function hh(){r.style.setProperty('--hh',h.offsetHeight+'px')}hh();addEventListener('resize',hh);})();
</script>
</body>
</html>
