<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Walk-through sample | BlackSheep Digital Works</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0A0B0D;color:#EFEBE3;font-family:Georgia,serif}
html[data-theme="light"],html[data-theme="light"] body{background:#F5F5F2;color:#111}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hint{position:fixed;top:14px;left:0;right:0;margin:0;text-align:center;font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;pointer-events:none}
.ui{position:fixed;left:0;right:0;bottom:0;padding:14px 10px calc(14px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.6))}
.ui button{font:600 12px/1 Georgia,serif;letter-spacing:.18em;text-transform:uppercase;padding:0 12px;min-height:44px;background:rgba(10,11,13,.75);color:#EFEBE3;border:1px solid #C49E4E;cursor:pointer}
html[data-theme="light"] .ui{background:linear-gradient(rgba(245,245,242,0),rgba(245,245,242,.9))}
html[data-theme="light"] .ui button{background:#fff;color:#111}
.ui button:focus-visible{outline:2px solid #C49E4E;outline-offset:3px}
</style>
</head>
<body>
<canvas id="c" aria-label="First-person walk-through sample"></canvas>
<p class="hint">Drag to look · WASD or arrow keys to walk · or use the buttons</p>
<div class="ui" role="toolbar" aria-label="Walk-through controls">
  <button type="button" data-go="0">Home</button>
  <button type="button" data-go="1">Services</button>
  <button type="button" data-go="2">Portfolio</button>
  <button type="button" data-go="3">About</button>
  <button type="button" data-go="4">Pricing</button>
  <button type="button" data-go="5">Contact</button>
  <button type="button" id="back" aria-label="Walk back">Back</button>
  <button type="button" id="fwd" aria-label="Walk forward">Forward</button>
  <button type="button" id="theme">Light / Dark</button>
</div>
<script src="../vendor/three-r128.min.js"></script>
<script>
(function(){
  var root = document.documentElement;
  var stored = localStorage.getItem('walk-theme'); if (stored) root.dataset.theme = stored;
  var dark = root.dataset.theme !== 'light';

  var T = dark
    ? {bg:0x0A0B0D, wall:0x15171b, floor:0x0d0e11, ceil:0x101216, panel:'#1a1c21', ink:'#EFEBE3', muted:'#A9ADB3', accent:'#C49E4E'}
    : {bg:0xF5F5F2, wall:0xe9e6df, floor:0xd8d4cb, ceil:0xf0eee9, panel:'#ffffff', ink:'#111111', muted:'#55595f', accent:'#9A1219'};

  var SECTIONS = [
    {t:'Home', s:'Real estate and dealership media'},
    {t:'Services', s:'Photography, video, drone, floor plans'},
    {t:'Portfolio', s:'Selected work'},
    {t:'About', s:'Who we are'},
    {t:'Pricing', s:'Packages for listings and events'},
    {t:'Contact', s:'Book a shoot'}
  ];

  var canvas = document.getElementById('c');
  var renderer = new THREE.WebGLRenderer({canvas: canvas, antialias: true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(T.bg);
  scene.fog = new THREE.Fog(T.bg, 12, 70);
  var camera = new THREE.PerspectiveCamera(65, 1, 0.1, 200);
  camera.rotation.order = 'YXZ';

  var LEN = 90, HALF = 4;
  function slab(w, h, color, pos, rot){
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({color: color}));
    m.position.set(pos[0], pos[1], pos[2]); if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
    scene.add(m); return m;
  }
  slab(HALF*2, LEN, T.floor, [0, 0, -LEN/2 + 10], [-Math.PI/2, 0, 0]);
  slab(HALF*2, LEN, T.ceil, [0, 3.2, -LEN/2 + 10], [Math.PI/2, 0, 0]);
  slab(LEN, 3.2, T.wall, [-HALF, 1.6, -LEN/2 + 10], [0, Math.PI/2, 0]);
  slab(LEN, 3.2, T.wall, [HALF, 1.6, -LEN/2 + 10], [0, -Math.PI/2, 0]);
  slab(HALF*2, 3.2, T.wall, [0, 1.6, -LEN + 10], [0, 0, 0]);

  function panelTexture(sec){
    var c = document.createElement('canvas'); c.width = 1024; c.height = 640;
    var x = c.getContext('2d');
    x.fillStyle = T.panel; x.fillRect(0, 0, 1024, 640);
    x.fillStyle = T.accent; x.fillRect(80, 300, 120, 3);
    x.fillStyle = T.ink; x.font = '600 96px Georgia, serif'; x.fillText(sec.t, 80, 230);
    x.fillStyle = T.muted; x.font = '400 40px Georgia, serif'; x.fillText(sec.s, 80, 380);
    var tex = new THREE.CanvasTexture(c); tex.needsUpdate = true;
    return tex;
  }

  var stops = [];
  SECTIONS.forEach(function(sec, i){
    var side = i % 2 ? 1 : -1;
    var z = 6 - i * 13;
    var m = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 2.25), new THREE.MeshBasicMaterial({map: panelTexture(sec)}));
    m.position.set(side * (HALF - 0.02), 1.6, z);
    m.rotation.y = -side * Math.PI / 2;
    scene.add(m);
    stops.push({x: 0, z: z + 1.5, yaw: side * Math.PI / 2});
  });

  var cam = {x: 0, z: 6, yaw: 0, pitch: 0};
  var target = null;
  var keys = {}, moveDir = 0;
  var dragging = false, lastX = 0, lastY = 0;

  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  function jump(i){ target = stops[i]; }
  Array.prototype.forEach.call(document.querySelectorAll('[data-go]'), function(b){
    b.addEventListener('click', function(){ jump(+b.dataset.go); });
  });
  function hold(btn, dir){
    btn.addEventListener('pointerdown', function(e){ moveDir = dir; target = null; btn.setPointerCapture(e.pointerId); });
    btn.addEventListener('pointerup', function(){ moveDir = 0; });
    btn.addEventListener('pointercancel', function(){ moveDir = 0; });
  }
  hold(document.getElementById('fwd'), 1);
  hold(document.getElementById('back'), -1);
  document.getElementById('theme').addEventListener('click', function(){
    var next = root.dataset.theme === 'light' ? 'dark' : 'light';
    localStorage.setItem('walk-theme', next);
    location.reload();
  });

  window.addEventListener('keydown', function(e){
    if (['KeyW','ArrowUp'].indexOf(e.code) > -1) keys.f = true;
    if (['KeyS','ArrowDown'].indexOf(e.code) > -1) keys.b = true;
    if (['KeyA','ArrowLeft'].indexOf(e.code) > -1) keys.l = true;
    if (['KeyD','ArrowRight'].indexOf(e.code) > -1) keys.r = true;
    if (keys.f || keys.b || keys.l || keys.r) target = null;
  });
  window.addEventListener('keyup', function(e){
    if (['KeyW','ArrowUp'].indexOf(e.code) > -1) keys.f = false;
    if (['KeyS','ArrowDown'].indexOf(e.code) > -1) keys.b = false;
    if (['KeyA','ArrowLeft'].indexOf(e.code) > -1) keys.l = false;
    if (['KeyD','ArrowRight'].indexOf(e.code) > -1) keys.r = false;
  });

  canvas.addEventListener('pointerdown', function(e){ dragging = true; lastX = e.clientX; lastY = e.clientY; target = null; });
  window.addEventListener('pointerup', function(){ dragging = false; });
  window.addEventListener('pointermove', function(e){
    if (!dragging) return;
    cam.yaw -= (e.clientX - lastX) * 0.004;
    cam.pitch -= (e.clientY - lastY) * 0.003;
    cam.pitch = Math.max(-0.6, Math.min(0.6, cam.pitch));
    lastX = e.clientX; lastY = e.clientY;
  });

  var last = performance.now();
  function frame(now){
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    var speed = 5.0 * dt;
    if (target){
      cam.x += (target.x - cam.x) * Math.min(1, dt * 3);
      cam.z += (target.z - cam.z) * Math.min(1, dt * 3);
      var dyaw = Math.atan2(Math.sin(target.yaw - cam.yaw), Math.cos(target.yaw - cam.yaw));
      cam.yaw += dyaw * Math.min(1, dt * 3);
      if (Math.abs(target.z - cam.z) < 0.02 && Math.abs(dyaw) < 0.01) target = null;
    } else {
      var fwd = (keys.f ? 1 : 0) - (keys.b ? 1 : 0) + moveDir;
      var strafe = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
      var fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);
      var sx = Math.cos(cam.yaw), sz = -Math.sin(cam.yaw);
      cam.x += (fx * fwd + sx * strafe) * speed;
      cam.z += (fz * fwd + sz * strafe) * speed;
    }
    cam.x = Math.max(-HALF + 0.6, Math.min(HALF - 0.6, cam.x));
    cam.z = Math.max(-LEN + 12, Math.min(8, cam.z));
    camera.position.set(cam.x, 1.6, cam.z);
    camera.rotation.y = cam.yaw;
    camera.rotation.x = cam.pitch;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
